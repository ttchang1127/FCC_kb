name: Update FCC regulatory sources

on:
  schedule:
    # Daily at 04:23 Asia/Taipei (20:23 UTC). Off-hour scheduling reduces delay.
    - cron: "23 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-regulations.yml"
      - "scripts/update_regulatory_data.py"
      - "data/review-baseline.json"

permissions:
  contents: write

concurrency:
  group: update-fcc-regulatory-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch current eCFR and Federal Register data
        run: python3 scripts/update_regulatory_data.py

      - name: Commit source status when changed
        run: |
          if git diff --quiet -- data/regulatory-status.json; then
            echo "No public source-data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regulatory-status.json
          git commit -m "自動更新：FCC 官方規範來源"
          git push
