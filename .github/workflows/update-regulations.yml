name: Update FCC regulatory sources

on:
  schedule:
    # Daily at 04:23 Asia/Taipei (20:23 UTC). Off-hour scheduling reduces delay.
    - cron: "23 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-regulations.yml"
      - "scripts/update_regulatory_data.py"
      - "data/review-baseline.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-fcc-regulatory-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch current eCFR and Federal Register data
        run: python3 scripts/update_regulatory_data.py --issue-body-output "$RUNNER_TEMP/fcc-review-issue.md"

      - name: Read human-review state
        id: review
        run: echo "required=$(jq -r '.review.status == "review_required"' data/regulatory-status.json)" >> "$GITHUB_OUTPUT"

      - name: Commit source status when changed
        run: |
          if git diff --quiet -- data/regulatory-status.json; then
            echo "No public source-data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regulatory-status.json
          git commit -m "自動更新：FCC 官方規範來源"
          git push

      - name: Create or update the single regulatory-review issue
        if: ${{ fromJSON(steps.review.outputs.required) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALERT_TITLE: "[Regulatory review required] FCC official source change"
          ALERT_LABEL: "regulatory-review"
          ISSUE_BODY: ${{ runner.temp }}/fcc-review-issue.md
        run: |
          gh label create "$ALERT_LABEL" --description "Official FCC source changes awaiting human legal review" --color "D93F0B" --force
          issue_number="$(gh issue list --state open --label "$ALERT_LABEL" --limit 100 --json number,title | jq -r --arg title "$ALERT_TITLE" '.[] | select(.title == $title) | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "$ALERT_TITLE" --body-file "$ISSUE_BODY" --add-label "$ALERT_LABEL"
            echo "Updated regulatory-review issue #$issue_number."
          else
            gh issue create --title "$ALERT_TITLE" --body-file "$ISSUE_BODY" --label "$ALERT_LABEL"
          fi

      - name: Report workflow failure
        if: ${{ failure() }}
        run: |
          echo "::error::FCC official-source update failed. Open this workflow run for the failing step."
          echo "## FCC source monitor failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the failing step; no legal baseline was accepted automatically." >> "$GITHUB_STEP_SUMMARY"
